e par l'association.</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="33"><path d="M6,411.151 L6,484.856 A0,0 0 0 0 6,484.856 L323.956,484.856 A0,0 0 0 0 323.956,484.856 L323.956,421.151 L313.956,411.151 L169,411.151 L165,374.514 L161,411.151 L6,411.151 A0,0 0 0 0 6,411.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M313.956,411.151 L313.956,421.151 L323.956,421.151 L313.956,411.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="429.221" fill="#000" font-size="13" textLength="219.686">Un même ingrédient peut être partagé</text><text x="12" y="445.147" fill="#000" font-size="13" textLength="296.956">par plusieurs pizzas (relation plusieurs-à-plusieurs).</text><text x="12" y="461.074" fill="#000" font-size="13" textLength="203.779">Il possède son propre cycle de vie :</text><text x="12" y="477" fill="#000" font-size="13" textLength="225.767">ce lien n'est pas une composition UML.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-link-type="association"><path d="M284.687,193.27 C266.297,211.229 246.669,230.396 228.741,247.904" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="263" y="226.221" fill="#000" font-size="13" textLength="45.532">contient</text><text x="208.741" y="244.974" fill="#000" font-size="13" textLength="19.513">1..*</text><text x="264.687" y="207.34" fill="#000" font-size="13" textLength="19.513">1..*</text></g><?plantuml-src hLFDQXH14BxtKvIvh3_iek1f3uAGoq848UvPAZELIM7_sLqjoOQ0L-y-W4Sthp5lufDOtUDELlGatdgwllf-gdeUnOI3Gx1u4uf0TYJeqGYB9HY_24Q2vo_Xn-UlSCeu97IEe2VeBEPC6Tou5wPayWVs4RKyLLwB9BueGfik-7FUAOcvOkrJ_glGPsCQ3DxoReTmQm2U0VUmXeqN6fIlNdXKhJMSAvKVuBPu_bZeRi8w76YRx5nkjp5nLpjEgLE0RNTT8XJgtwFKWXxViQDMAR7_I-NkO6tZXqGzavT_yFUVd4pZENcnMZqzWUNoS3gojWOTiBJZAsDy48AB818SXCjfkggmzGInKSrWBE02-mp5WxfFutxYeslE-W9afMrd15w9-aMP-oaBJ3ahW6SV6VoYrg8jZH9_xH-4hjNIMi6sghiOCWi7tvWIHHNEsZ_kLG4Js8MEFdIC5RCov7kecVv8zZ215a-VuRtkuZX895KVxoKrOi5