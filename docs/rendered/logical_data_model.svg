 textLength="156.379">name : TEXT «UNIQUE»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="607" cy="147.03" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="616" y="151.029" fill="#000" font-size="14" textLength="78.586">price : REAL</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="607" cy="164.181" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="616" y="168.181" fill="#000" font-size="14" textLength="113.606">created_at : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="607" cy="181.333" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="616" y="185.332" fill="#000" font-size="14" textLength="117.517">updated_at : TEXT</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="33"><path d="M287.5,375.151 L287.5,480.709 A0,0 0 0 0 287.5,480.709 L656.383,480.709 A0,0 0 0 0 656.383,480.709 L656.383,385.151 L646.383,375.151 L476,375.151 L472,338.261 L468,375.151 L287.5,375.151 A0,0 0 0 0 287.5,375.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M646.383,375.151 L646.383,385.151 L656.383,385.151 L646.383,375.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="293.5" y="393.221" fill="#000" font-size="13" textLength="233.403">PK composée : (pizza_id, ingredient_id).</text><text x="293.5" y="409.147" fill="#000" font-size="13" textLength="292.291">Un ingrédient ne figure qu'une fois dans une pizza.</text><text x="293.5" y="425.074" fill="#000" font-size="13" textLength="292.233">FK pizza_id -> pizzas.id : ON DELETE CASCADE.</text><text x="293.5" y="441" fill="#000" font-size="13" textLength="347.883">FK ingredient_id -> ingredients.id : ON DELETE RESTRICT.</text><text x="293.5" y="456.926" fill="#000" font-size="13" textLength="255.062">Supprimer une pizza retire ses associations,</text><text x="293.5" y="472.853" fill="#000" font-size="13" textLength="234.121">sans supprimer les ingrédients partagés.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="42"><path d="M6,260.151 L6,333.856 A0,0 0 0 0 6,333.856 L331.954,333.856 A0,0 0 0 0 331.954,333.856 L331.954,270.151 L321.954,260.151 L186.959,260.151 L205.301,201.49 L178.959,260.151 L6,260.151 A0,0 0 0 0 6,260.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M321.954,260.151 L321.954,270.151 L331.954,270.151 L321.954,260.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="278.221" fill="#000" font-size="13" textLength="204.115">CHECK(price > 0) ; name non vide.</text><text x="12" y="294.147" fill="#000" font-size="13" textLength="300.936">L'ancienne colonne ingredients TEXT est remplacée</text><text x="12" y="310.074" fill="#000" font-size="13" textLength="222.174">par les lignes de la table d'association.</text><text x="12" y="326" fill="#000" font-size="13" textLength="304.954">Création de la pizza et de ses liens : une transaction.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="49"><path d="M612,260.151 L612,333.856 A0,0 0 0 0 612,333.856 L906.165,333.856 A0,0 0 0 0 906.165,333.856 L906.165,270.151 L896.165,260.151 L747.6,260.151 L715.043,192.67 L739.6,260.151 L612,260.151 A0,0 0 0 0 612,260.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M896.165,260.151 L896.165,270.151 L906.165,270.151 L896.165,260.151" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="618" y="278.221" fill="#000" font-size="13" textLength="211.707">CHECK(price >= 0) ; name non vide.</text><text x="618" y="294.147" fill="#000" font-size="13" textLength="213.865">Les minima métier 1..* sont contrôlés</text><text x="618" y="310.074" fill="#000" font-size="13" textLength="273.165">par la logique applicative : une FK ne suffit pas.</text><text x="618" y="326" fill="#000" font-size="13" textLength="222.168">SQLite : PRAGMA foreign_keys = ON.</text></g><g class="link"